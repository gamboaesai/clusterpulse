apiVersion: v1
kind: ServiceAccount
metadata:
  name: clusterpulse
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterpulse-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusterpulse-reader-binding
subjects:
  - kind: ServiceAccount
    name: clusterpulse
    namespace: default
roleRef:
  kind: ClusterRole
  name: clusterpulse-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterpulse
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clusterpulse
  template:
    metadata:
      labels:
        app: clusterpulse
    spec:
      serviceAccountName: clusterpulse
      containers:
        - name: clusterpulse
          image: localhost/clusterpulse:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clusterpulse
  namespace: default
spec:
  selector:
    app: clusterpulse
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
