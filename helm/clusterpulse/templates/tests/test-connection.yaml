apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "clusterpulse.fullname" . }}-test-connection"
  labels:
    {{- include "clusterpulse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args:
        - '--spider'
        - '-q'
        - 'http://{{ include "clusterpulse.fullname" . }}:{{ .Values.service.port }}/health'
  restartPolicy: Never
